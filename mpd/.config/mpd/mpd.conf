music_directory     "~/Music"
playlist_directory  "~/Music/"
db_file             "~/.config/mpd/mpd.db"
log_file            "~/.config/mpd/mpd.log"
pid_file            "~/.config/mpd/mpd.pid"
state_file          "~/.config/mpd/mpdstate"
auto_update         "yes"
follow_outside_symlinks "yes"
follow_inside_symlinks  "yes"

# Listening socket is provided by mpd.socket (systemd user unit).
# Do not set bind_to_address/port here — they conflict with the inherited fd.

# ──────────────────────────────────────────────────────────────
# PipeWire Sound Output (Standard for modern Arch Linux / Hyprland)
# ──────────────────────────────────────────────────────────────
audio_output {
    type            "pipewire"
    name            "PipeWire Sound Server"
}

# Visualizer FIFO (Allows audio visualizers like Cava to work!)
audio_output {
    type            "fifo"
    name            "Visualizer FIFO"
    path            "/tmp/mpd.fifo"
    format          "44100:16:2"
}
