# Enable True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"
# Tell tmux ghostty supports kitty graphics + hyperlinks so image probes pass.
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:ccolour:cstyle:focus:title"
# `all` (not just `on`) is required for graphics-protocol passthrough (Yazi, etc.)
set -gq allow-passthrough all
# Forward terminal identity env into new panes so apps can detect ghostty.
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g base-index 1
set -g pane-base-index 1

set-option -g prefix C-b
set-option -g prefix2 none

# Prevent detaching when session is destroyed
set -g detach-on-destroy off

unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind v
bind v copy-mode

# Resize panes with hjkl
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Maximize pane toggle
bind -r m resize-pane -Z

# Disable kill confirmation prompt for fast workflows
bind x kill-pane

# mouse support
set -g mouse on

# vim shell navigations and selects in tmux panes
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# ──────────────────────────────────────────────────────────────
# Custom Floating Popups & Sesh Integrations
# ──────────────────────────────────────────────────────────────
# Float File Explorer (Yazi)
bind C-y display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi"

# Float Quick Scratch Terminal (Zsh)
bind C-t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "zsh"

# Float Version Control (Lazygit)
bind C-g display-popup -d "#{pane_current_path}" -w 92% -h 92% -E "lazygit"

# Float Music Player Client (rmpc)
bind C-m display-popup -w 95% -h 95% -E "rmpc"

# Interactive Configuration Selector Menu in floating popup
bind d display-menu -T "#[align=centre]Quick Config Selector" -x C -y C \
    ".zshrc"            z  "display-popup -w 85% -h 85% -E 'nvim ~/my-dotfiles/zsh/.zshrc'" \
    "tmux.conf"         t  "display-popup -w 85% -h 85% -E 'nvim ~/my-dotfiles/tmux/.config/tmux/tmux.conf'" \
    "neovim init"       v  "display-popup -w 95% -h 95% -E 'nvim ~/my-dotfiles/nvim/.config/nvim/init.lua'" \
    "hyprland"          h  "display-popup -w 95% -h 95% -E 'nvim ~/my-dotfiles/hypr/.config/hypr/hyprland.conf'" \
    "keyd layer"        k  "display-popup -w 90% -h 90% -E 'nvim /etc/keyd/default.conf'" \
    "quit"              q  ""

# Switch to a tmux session via custom sessionizer (stowed bin path)
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind n command-prompt "new-session -s '%%'"

# Press prefix + a to go to the last window
bind a last-window

# Drag copy using mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# ──────────────────────────────────────────────────────────────
# Tmux Plugins Configuration (TPM)
# ──────────────────────────────────────────────────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm' # must be the first plugin
set -g @plugin "christoomey/vim-tmux-navigator"

set -g @plugin 'omerxx/tmux-sessionx' # default keybind "<prefix> o" to activate
set -g @plugin "tmux-plugins/tmux-resurrect" #persist tmux sessions after computer restart
set -g @plugin "tmux-plugins/tmux-continuum" #automatically save sessions every 15mins

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @sessionx-bind 'o'
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"

# Configure Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Configure Online status
set -g @online_icon "ok"
set -g @offline_icon "nok"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"

# Configure Tmux Status bar
set -g status-position bottom
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"

run '~/.config/tmux/.tmux/plugins/tpm/tpm' # always keep this line last
