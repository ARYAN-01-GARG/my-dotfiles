# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME









# ─────────────────────────────────────────────────────────────
# App → dedicated workspace bindings
# Pattern: keybind launches the app; windowrulev2 below pins
# it to its workspace and switches focus there.
# ─────────────────────────────────────────────────────────────

# Spotify → workspace 10
bindd = $mainMod, M, open Spotify on workspace 10, exec, [workspace 10] spotify
windowrule = workspace 10, match:class ^(Spotify)$

# VS Code → workspace 3
bindd = $mainMod, V, open VS Code on workspace 3, exec, [workspace 3] code
windowrule = workspace 3, match:class ^(Code)$


# ─────────────────────────────────────────────────────────────
# Quick-app launch row (Super+Shift+<key>)
# ─────────────────────────────────────────────────────────────
bindd = $mainMod SHIFT, F, browser, exec, xdg-open about:blank
bindd = $mainMod SHIFT, E, file manager, exec, $files
# (NOTE: $mainMod SHIFT, M was online-music via rofi — left intact in main keybinds)


# ─────────────────────────────────────────────────────────────
# Screenshot to clipboard (no file saved)
# ─────────────────────────────────────────────────────────────
bindd = CTRL, Print, screenshot area to clipboard, exec, grim -g "$(slurp)" - | wl-copy
bindd = $mainMod CTRL SHIFT, Print, screenshot full to clipboard, exec, grim - | wl-copy


# ─────────────────────────────────────────────────────────────
# Fine volume / brightness (1% steps when holding Ctrl)
# Default 5% bindings already exist in configs/Keybinds.conf
# ─────────────────────────────────────────────────────────────
binded = CTRL, xf86audioraisevolume, volume +1%, exec, pactl set-sink-volume @DEFAULT_SINK@ +1%
binded = CTRL, xf86audiolowervolume, volume -1%, exec, pactl set-sink-volume @DEFAULT_SINK@ -1%
binded = CTRL, xf86MonBrightnessUp, brightness +1%, exec, brightnessctl set +1%
binded = CTRL, xf86MonBrightnessDown, brightness -1%, exec, brightnessctl set 1%-


# ─────────────────────────────────────────────────────────────
# Smart gaps — collapse gaps when only one tiled window in workspace
# w[tv1] = workspace with one tiled visible window
# f[1]   = workspace with one fullscreen window
# (border/rounding windowrules dropped; Hyprland 0.55 syntax differs and
#  the gap collapse alone gives the cleanest visual win.)
# ─────────────────────────────────────────────────────────────
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1],   gapsout:0, gapsin:0


# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset
