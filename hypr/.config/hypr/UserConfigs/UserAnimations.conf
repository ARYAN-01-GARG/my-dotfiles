animations {
  enabled = yes

  bezier = appleEase,   0.25, 0.1, 0.25, 1.0
  bezier = appleSpring, 0.50, 0.0, 0.10, 1.0
  bezier = appleSnap,   0.20, 0.0, 0.00, 1.0
  bezier = liner,       1, 1, 1, 1

  animation = windows,       1, 4, appleEase,   slide
  animation = windowsIn,     1, 4, appleSpring, slide
  animation = windowsOut,    1, 3, appleSnap,   slide
  animation = windowsMove,   1, 4, appleEase,   slide
  animation = border,        1, 1, liner
  animation = borderangle,   1, 180, liner, loop
  animation = fade,          1, 3, appleEase
  animation = workspaces,    1, 4, appleSpring, slide
  animation = workspacesIn,  1, 4, appleSpring, slide
  animation = workspacesOut, 1, 3, appleSnap,   slide
}
