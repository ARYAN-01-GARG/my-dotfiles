### Aquamarine Environment Variables (Hyprland > 0.45) ###
# https://wiki.hyprland.org/Configuring/Environment-variables/#aquamarine-environment-variables
# env = AQ_TRACE,1 # Enables more verbose logging.
# AQ_DRM_DEVICES forces which GPU(s) Hyprland renders on. In Integrated (dGPU off)
# mode there is only ONE card on the bus, so Hyprland auto-detects it correctly and
# this MUST stay commented. Do NOT put an inline comment after the value — Hyprland
# treats everything after the comma as the device path, so a trailing comment makes
# it try to open a bogus path and abort with "CBackend::create() failed!" (black
# screen → back to SDDM). If you re-enable Hybrid mode, uncomment ONLY the next line:
# env = AQ_DRM_DEVICES,/dev/dri/by-path/pci-0000:06:00.0-card
# env = AQ_MGPU_NO_EXPLICIT,1 # Only relevant for multi-GPU; not needed with single (AMD-only) primary above.
# env = AQ_NO_MODIFIERS,1 # Disables modifiers for DRM buffers
